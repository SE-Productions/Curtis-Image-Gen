kind = "mobile"
previewPath = "/curtis-image-studio-mobile/"
title = "Curtis Image Studio Mobile"
description = "A mobile companion for Curtis Image Studio with camera-roll references, scene generation, camera-roll exports, and Reel or Story rendering."
version = "1.0.0"
id = "artifacts/curtis-image-studio-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/curtis-image-studio-mobile/" ]
localPort = 25268

[services.development]
run = "pnpm --filter @workspace/curtis-image-studio-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/curtis-image-studio-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/curtis-image-studio-mobile", "run", "serve" ]

[services.env]
PORT = "25268"
BASE_PATH = "/curtis-image-studio-mobile/"
