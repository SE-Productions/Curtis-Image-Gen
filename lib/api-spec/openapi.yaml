openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: studio
    description: Curtis Image Studio generation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /studio/capabilities:
    get:
      operationId: getStudioCapabilities
      tags: [studio]
      summary: Get available studio generation capabilities
      responses:
        "200":
          description: Studio capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioCapabilities"
  /studio/images:
    post:
      operationId: generateStudioImage
      tags: [studio]
      summary: Generate a reference-guided scene image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioImageInput"
      responses:
        "200":
          description: Generated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioImage"
        "400":
          description: Invalid generation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Image provider could not complete the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/session:
    get:
      operationId: getStudioSession
      tags: [studio]
      summary: Report whether the caller has an unlocked operator session
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSessionStatus"
    post:
      operationId: createStudioSession
      tags: [studio]
      summary: Unlock the studio with the operator access password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioSessionInput"
      responses:
        "200":
          description: Studio unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioSessionStatus"
        "401":
          description: Incorrect access password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStudioSession
      tags: [studio]
      summary: Lock the studio (clear the operator session)
      responses:
        "204":
          description: Studio locked
  /studio/scenes:
    get:
      operationId: getStudioScenes
      tags: [studio]
      summary: List generated studio scenes
      responses:
        "200":
          description: Generated scenes, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudioScene"
        "401":
          description: Studio is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createStudioScene
      tags: [studio]
      summary: Save a generated studio scene
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioSceneInput"
      responses:
        "201":
          description: Saved generated scene
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioScene"
        "400":
          description: Invalid scene
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Studio is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Scene image is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStudioScenes
      tags: [studio]
      summary: Delete all generated studio scenes
      responses:
        "204":
          description: All generated scenes deleted
        "401":
          description: Studio is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/scenes/{sceneId}:
    delete:
      operationId: deleteStudioScene
      tags: [studio]
      summary: Delete one generated studio scene
      parameters:
        - name: sceneId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Generated scene deleted
        "401":
          description: Studio is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Generated scene not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/post-copy:
    post:
      operationId: generateStudioPostCopy
      tags: [studio]
      summary: Generate an editable Instagram caption for a studio asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioPostCopyInput"
      responses:
        "200":
          description: Generated post copy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioPostCopy"
        "400":
          description: Invalid post-copy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Copy provider could not complete the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/videos:
    post:
      operationId: startStudioVideo
      tags: [studio]
      summary: Start a face-preserving Reel or Story video render
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioVideoInput"
      responses:
        "200":
          description: Video render task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioVideoTask"
        "400":
          description: Invalid video render request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A public deployment URL is required for video rendering
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Video rendering is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Video provider could not start the render
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/videos/{taskId}:
    get:
      operationId: getStudioVideo
      tags: [studio]
      summary: Get the current status and result of a studio video render
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current video render task state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioVideoTask"
        "404":
          description: Video render task was not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Video provider could not retrieve the render
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/instagram/status:
    get:
      operationId: getInstagramPublishingStatus
      tags: [studio]
      summary: Get the authoritative Composio and Instagram connection status
      responses:
        "200":
          description: Instagram publishing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramPublishingStatus"
        "401":
          description: Studio is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Composio connection status could not be retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/assets/{assetId}:
    get:
      operationId: getStudioAsset
      tags: [studio]
      summary: Retrieve a temporary image asset prepared for publishing
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image asset
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Asset not found or expired
  /studio/instagram/connect:
    post:
      operationId: beginInstagramConnection
      tags: [studio]
      summary: Start the Instagram account connection flow
      responses:
        "200":
          description: Instagram authorization link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramConnection"
        "401":
          description: Studio is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Instagram publishing is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: disconnectInstagramAccount
      tags: [studio]
      summary: Disconnect the studio owner's Instagram account
      responses:
        "204":
          description: Instagram account disconnected
        "401":
          description: Studio is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Instagram publishing is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Instagram account could not be disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/instagram/publish:
    post:
      operationId: publishStudioImageToInstagram
      tags: [studio]
      summary: Publish a generated image to the connected Instagram account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstagramPublishInput"
      responses:
        "200":
          description: Published Instagram post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramPublication"
        "400":
          description: Invalid publishing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A public deployment URL is needed before publishing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Instagram could not complete the post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/creator-dna:
    get:
      operationId: getCreatorDna
      tags: [studio]
      summary: Get the creator context used for planning
      responses:
        "200":
          description: Creator DNA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorDna"
    put:
      operationId: updateCreatorDna
      tags: [studio]
      summary: Save the creator context used for planning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorDnaInput"
      responses:
        "200":
          description: Saved Creator DNA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorDna"
        "400":
          description: Invalid Creator DNA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/content-plan:
    get:
      operationId: getContentPlan
      tags: [studio]
      summary: Get a persisted weekly content plan
      parameters:
        - name: weekStart
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Weekly plan or null when it has not been created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPlanResult"
  /studio/content-plan/generate:
    post:
      operationId: generateContentPlan
      tags: [studio]
      summary: Generate and persist an editable seven-day content plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateContentPlanInput"
      responses:
        "200":
          description: Generated weekly content plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentPlan"
        "400":
          description: Creator DNA or plan request is incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Planning provider failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/content-items/{contentItemId}:
    patch:
      operationId: updateContentItem
      tags: [studio]
      summary: Edit a planned content item
      parameters:
        - $ref: "#/components/parameters/ContentItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentItemUpdate"
      responses:
        "200":
          description: Updated content item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
        "404":
          description: Content item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteContentItem
      tags: [studio]
      summary: Delete a planned content item
      parameters:
        - $ref: "#/components/parameters/ContentItemId"
      responses:
        "204":
          description: Content item deleted
  /studio/content-items/{contentItemId}/variations:
    post:
      operationId: addContentVariation
      tags: [studio]
      summary: Link a real generated scene to a planned content item
      parameters:
        - $ref: "#/components/parameters/ContentItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddContentVariationInput"
      responses:
        "204":
          description: Generated scene linked to the content item
        "404":
          description: Content item or scene not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/content-items/{contentItemId}/approve:
    post:
      operationId: approveContentItem
      tags: [studio]
      summary: Approve one generated variation for publishing
      parameters:
        - $ref: "#/components/parameters/ContentItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveContentItemInput"
      responses:
        "204":
          description: Content item approved
        "409":
          description: Scene is not a variation of this content item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/content-items/{contentItemId}/schedule:
    post:
      operationId: scheduleContentItem
      tags: [studio]
      summary: Schedule an approved content item
      parameters:
        - $ref: "#/components/parameters/ContentItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleContentItemInput"
      responses:
        "204":
          description: Content item scheduled
        "409":
          description: Schedule slot is invalid or already occupied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unscheduleContentItem
      tags: [studio]
      summary: Return a scheduled content item to approved status
      parameters:
        - $ref: "#/components/parameters/ContentItemId"
      responses:
        "204":
          description: Content item unscheduled
  /studio/content-items/{contentItemId}/publication:
    post:
      operationId: recordContentPublication
      tags: [studio]
      summary: Record the real Instagram publication result
      parameters:
        - $ref: "#/components/parameters/ContentItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordContentPublicationInput"
      responses:
        "204":
          description: Publication result recorded
components:
  parameters:
    ContentItemId:
      name: contentItemId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudioCapabilities:
      type: object
      required: [imageGeneration, referenceGuidance, provider, grokConfigured]
      properties:
        imageGeneration:
          type: boolean
        referenceGuidance:
          type: boolean
        provider:
          type: string
        grokConfigured:
          type: boolean
    StudioImageInput:
      type: object
      required: [prompt, aspectRatio]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 6000
        aspectRatio:
          type: string
          enum: ["16:9", "9:16", "1:1"]
        referenceImage:
          type: ["string", "null"]
          maxLength: 16000000
        fidelity:
          type: string
          enum: ["high", "balanced"]
          default: high
        provider:
          type: string
          enum: ["openai", "grok"]
          default: openai
    StudioImage:
      type: object
      required: [imageDataUrl, provider, referenceUsed, fidelity]
      properties:
        imageDataUrl:
          type: string
        provider:
          type: string
        referenceUsed:
          type: boolean
        fidelity:
          type: string
          enum: ["high", "balanced"]
    StudioSceneInput:
      type: object
      required: [prompt, aspectRatio, fidelity, referenceUsed, imageDataUrl, provider]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 6000
        aspectRatio:
          type: string
          enum: ["16:9", "9:16", "1:1"]
        fidelity:
          type: string
          enum: ["high", "balanced"]
        referenceUsed:
          type: boolean
        imageDataUrl:
          type: string
          maxLength: 16000000
        provider:
          type: string
          maxLength: 200
    StudioScene:
      type: object
      required: [id, prompt, aspectRatio, fidelity, referenceUsed, imageDataUrl, provider, createdAt]
      properties:
        id:
          type: string
        prompt:
          type: string
        aspectRatio:
          type: string
          enum: ["16:9", "9:16", "1:1"]
        fidelity:
          type: string
          enum: ["high", "balanced"]
        referenceUsed:
          type: boolean
        imageDataUrl:
          type: string
        provider:
          type: string
        createdAt:
          type: string
          format: date-time
    StudioSessionInput:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 200
    StudioSessionStatus:
      type: object
      required: [unlocked, required]
      properties:
        unlocked:
          type: boolean
          description: Whether the caller currently holds a valid operator session
        required:
          type: boolean
          description: Whether an access password is configured (false in open dev mode)
    StudioPostCopyInput:
      type: object
      required: [prompt, format]
      properties:
        title:
          type: string
          maxLength: 160
        visualDescription:
          type: string
          maxLength: 2000
        prompt:
          type: string
          minLength: 1
          maxLength: 6000
        format:
          type: string
          enum: ["feed", "reel", "story"]
    StudioPostCopy:
      type: object
      required: [caption]
      properties:
        caption:
          type: string
          maxLength: 2200
    StudioVideoInput:
      type: object
      required: [imageDataUrl, prompt, format]
      properties:
        imageDataUrl:
          type: string
          maxLength: 16000000
        prompt:
          type: string
          minLength: 1
          maxLength: 6000
        format:
          type: string
          enum: ["reel", "story"]
        durationSeconds:
          type: integer
          enum: [5, 10, 15, 20]
          default: 5
    StudioVideoTask:
      type: object
      required: [taskId, status, format]
      properties:
        taskId:
          type: string
        status:
          type: string
          enum: ["queued", "processing", "completed", "failed"]
        format:
          type: string
          enum: ["reel", "story"]
        videoUrl:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
    InstagramPublishingStatus:
      type: object
      required:
        [
          available,
          configured,
          connected,
          connectionStatus,
          accountLabel,
          accountType,
          updatedAt,
        ]
      properties:
        available:
          type: boolean
          description: Whether Instagram publishing is currently ready to use
        configured:
          type: boolean
          description: Whether the server has a protected Composio configuration
        connected:
          type: boolean
          description: Whether Composio reports an active Instagram connected account
        connectionStatus:
          type: string
          enum: [not_configured, disconnected, connecting, connected, attention]
        accountLabel:
          type: ["string", "null"]
          description: A safe alias for the connected account when Composio provides one
        accountType:
          type: string
        updatedAt:
          type: ["string", "null"]
          format: date-time
    InstagramConnection:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
        expiresAt:
          type: ["string", "null"]
    InstagramPublishInput:
      type: object
      required: [imageDataUrl, caption]
      properties:
        imageDataUrl:
          type: string
          maxLength: 16000000
        caption:
          type: string
          minLength: 1
          maxLength: 2200
    InstagramPublication:
      type: object
      required: [postId, publicImageUrl, status]
      properties:
        postId:
          type: string
        publicImageUrl:
          type: string
        status:
          type: string
    CreatorDnaInput:
      type: object
      required: [voice, audience, visualStyle, themes, offers, goals]
      properties:
        voice:
          type: string
          minLength: 1
          maxLength: 2000
        audience:
          type: string
          minLength: 1
          maxLength: 2000
        visualStyle:
          type: string
          minLength: 1
          maxLength: 2000
        themes:
          type: array
          minItems: 1
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 120
        offers:
          type: string
          maxLength: 2000
        goals:
          type: string
          minLength: 1
          maxLength: 2000
    CreatorDna:
      type: object
      required: [voice, audience, visualStyle, themes, offers, goals, updatedAt]
      properties:
        voice:
          type: string
        audience:
          type: string
        visualStyle:
          type: string
        themes:
          type: array
          items:
            type: string
        offers:
          type: string
        goals:
          type: string
        updatedAt:
          type: ["string", "null"]
          format: date-time
    GenerateContentPlanInput:
      type: object
      required: [weekStart, brief]
      properties:
        weekStart:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        brief:
          type: string
          minLength: 1
          maxLength: 3000
    ContentVariation:
      type: object
      required: [id, sceneId, ordinal, imageDataUrl, provider, createdAt]
      properties:
        id:
          type: string
        sceneId:
          type: string
        ordinal:
          type: number
        imageDataUrl:
          type: string
        provider:
          type: string
        createdAt:
          type: string
          format: date-time
    ContentItem:
      type: object
      required:
        [
          id,
          planDate,
          title,
          concept,
          prompt,
          caption,
          format,
          status,
          provider,
          selectedSceneId,
          scheduledFor,
          publishedAt,
          instagramPostId,
          failureReason,
          variations,
        ]
      properties:
        id:
          type: string
        planDate:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        title:
          type: string
        concept:
          type: string
        prompt:
          type: string
        caption:
          type: string
        format:
          type: string
          enum: [feed, story, reel]
        status:
          type: string
          enum: [idea, generated, approved, scheduled, published, failed]
        provider:
          type: string
          enum: [openai, grok]
        selectedSceneId:
          type: ["string", "null"]
        scheduledFor:
          type: ["string", "null"]
          format: date-time
        publishedAt:
          type: ["string", "null"]
          format: date-time
        instagramPostId:
          type: ["string", "null"]
        failureReason:
          type: ["string", "null"]
        variations:
          type: array
          items:
            $ref: "#/components/schemas/ContentVariation"
    ContentPlan:
      type: object
      required: [id, weekStart, brief, createdAt, updatedAt, items]
      properties:
        id:
          type: string
        weekStart:
          type: string
          pattern: '^\d{4}-\d{2}-\d{2}$'
        brief:
          type: string
