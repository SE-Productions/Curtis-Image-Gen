openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: studio
    description: Curtis Image Studio generation operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /studio/capabilities:
    get:
      operationId: getStudioCapabilities
      tags: [studio]
      summary: Get available studio generation capabilities
      responses:
        "200":
          description: Studio capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioCapabilities"
  /studio/images:
    post:
      operationId: generateStudioImage
      tags: [studio]
      summary: Generate a reference-guided scene image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioImageInput"
      responses:
        "200":
          description: Generated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioImage"
        "400":
          description: Invalid generation request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Image provider could not complete the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/instagram/status:
    get:
      operationId: getInstagramPublishingStatus
      tags: [studio]
      summary: Get Instagram publishing availability
      responses:
        "200":
          description: Instagram publishing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramPublishingStatus"
  /studio/assets/{assetId}:
    get:
      operationId: getStudioAsset
      tags: [studio]
      summary: Retrieve a temporary image asset prepared for publishing
      parameters:
        - name: assetId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image asset
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Asset not found or expired
  /studio/instagram/connect:
    post:
      operationId: beginInstagramConnection
      tags: [studio]
      summary: Start the Instagram account connection flow
      responses:
        "200":
          description: Instagram authorization link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramConnection"
        "503":
          description: Instagram publishing is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio/instagram/publish:
    post:
      operationId: publishStudioImageToInstagram
      tags: [studio]
      summary: Publish a generated image to the connected Instagram account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstagramPublishInput"
      responses:
        "200":
          description: Published Instagram post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramPublication"
        "400":
          description: Invalid publishing request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A public deployment URL is needed before publishing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Instagram could not complete the post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudioCapabilities:
      type: object
      required: [imageGeneration, referenceGuidance, provider]
      properties:
        imageGeneration:
          type: boolean
        referenceGuidance:
          type: boolean
        provider:
          type: string
    StudioImageInput:
      type: object
      required: [prompt, aspectRatio]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 6000
        aspectRatio:
          type: string
          enum: ["16:9", "9:16", "1:1"]
        referenceImage:
          type: ["string", "null"]
          maxLength: 16000000
    StudioImage:
      type: object
      required: [imageDataUrl, provider, referenceUsed]
      properties:
        imageDataUrl:
          type: string
        provider:
          type: string
        referenceUsed:
          type: boolean
    InstagramPublishingStatus:
      type: object
      required: [available, accountType]
      properties:
        available:
          type: boolean
        accountType:
          type: string
    InstagramConnection:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
        expiresAt:
          type: ["string", "null"]
    InstagramPublishInput:
      type: object
      required: [imageDataUrl, caption]
      properties:
        imageDataUrl:
          type: string
          maxLength: 16000000
        caption:
          type: string
          minLength: 1
          maxLength: 2200
    InstagramPublication:
      type: object
      required: [postId, publicImageUrl, status]
      properties:
        postId:
          type: string
        publicImageUrl:
          type: string
        status:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

