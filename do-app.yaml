# DigitalOcean App Platform — Curtis Image Studio
name: curtis-image-studio
region: nyc

services:
  - name: web
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    source_dir: /
    build_command: npm ci && npm run build
    run_command: npx vite preview --host 0.0.0.0 --port 8080
    health_check:
      http_path: /
      port: 8080
      initial_delay_seconds: 20
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: BETTER_AUTH_URL
        scope: RUN_TIME
        type: GENERAL
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: NVIDIA_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: NVIDIA_PROMPT_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: XAI_API_KEY
        scope: RUN_TIME
        type: SECRET
