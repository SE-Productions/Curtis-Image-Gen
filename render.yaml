services:
  - type: web
    name: curtis-image-studio
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npx vite preview --host 0.0.0.0 --port 8080
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: BETTER_AUTH_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_PROMPT_MODEL
        value: meta/llama-3.1-70b-instruct
      - key: XAI_API_KEY
        sync: false
