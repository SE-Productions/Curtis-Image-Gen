services:
  - type: web
    name: curtis-image-studio
    runtime: node
    plan: free
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      PORT=5173 BASE_PATH=/ pnpm --filter @workspace/curtis-image-studio run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: SERVE_STUDIO_STATIC=true node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STUDIO_STATIC
        value: "true"
      - key: PORT
        value: "10000"
      - key: PUBLIC_APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: A2E_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_PROMPT_MODEL
        value: meta/llama-3.1-70b-instruct
