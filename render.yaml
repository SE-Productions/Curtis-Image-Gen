services:
  - type: web
    name: curtis-image-studio
    runtime: node
    plan: starter
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      PORT=5173 BASE_PATH=/ pnpm --filter @workspace/curtis-image-studio run build &&
      pnpm --filter @workspace/api-server run build
    startCommand: SERVE_STUDIO_STATIC=true node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_STUDIO_STATIC
        value: "true"
      - key: PORT
        value: "10000"
      - key: PUBLIC_APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        sync: false
      - key: A2E_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_PROMPT_MODEL
        value: meta/llama-3.1-70b-instruct

  # Keeps the web service awake on the free tier.
  # On paid plans (Starter+) the web service never sleeps and this
  # cron job is simply a no-op health-check log entry — harmless either way.
  - type: cron
    name: curtis-studio-keepalive
    runtime: node
    plan: starter
    schedule: "*/14 * * * *"
    buildCommand: "echo 'keepalive'"
    startCommand: >-
      node -e "
        fetch(process.env.TARGET_URL + '/api/healthz')
          .then(r => console.log('keepalive', r.status))
          .catch(e => console.error('keepalive failed', e.message));
      "
    envVars:
      - key: TARGET_URL
        sync: false
